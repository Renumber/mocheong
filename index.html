<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>%VITE_OG_TITLE%</title>
    <meta name="description" content="%VITE_OG_DESCRIPTION%" />

    <!-- Open Graph (카카오톡 / SNS 공유 카드) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="%VITE_OG_TITLE%" />
    <meta property="og:description" content="%VITE_OG_DESCRIPTION%" />
    <meta property="og:image" content="%VITE_OG_IMAGE%" />
    <meta property="og:url" content="%VITE_SITE_URL%" />
    <meta property="og:locale" content="ko_KR" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%VITE_OG_TITLE%" />
    <meta name="twitter:description" content="%VITE_OG_DESCRIPTION%" />
    <meta name="twitter:image" content="%VITE_OG_IMAGE%" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
